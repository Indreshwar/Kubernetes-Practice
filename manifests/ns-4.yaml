---
apiVersion: v1
kind: Namespace
metadata:
  name: my-namespace
  labels:
    type: ns
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod-1
  namespace: my-namespace 
spec:
  containers:
    - name: nginx-pod-1
      image: nginx
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod-2
  namespace: dev
spec:
  containers:
    - name: nginx-pod-2
      image: nginx
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 100m
          memory: 256M
      