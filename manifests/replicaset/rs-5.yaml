---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-demo-rs 
  labels:
    app: nginx-rs 
    type: rs
    envi: production
spec:
  replicas: 3
  selector: 
    matchLabels: 
      env: production
    matchExpressions: #is of type array
      - {key: app, operator: Exists}  #if key app is present in template-labels then it will create
      - {key: type, operator: DoesNotExist} #if the key type is not present in template =labels then it will create
  template:
    metadata:
      name: nginx-demo
      labels:
        env:  production
        app: nginx-prod
        release: v1.2
    spec:
      containers:
        - name: writer-container
          image: alpine
          command: ["/bin/sh"]
          args: ["-c","echo Hello world > /container-data/index.html; sleep 1d"]
          volumeMounts:
            - name: shared-data
              mountPath: /container-data
        - name: read-container
          image: nginx
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: shared-data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: shared-data
          emptyDir: {}